services:
  api:
    build: ./api
    container_name: vista-api
    restart: unless-stopped
    environment:
      # --- Envisalink connection (defaults; overridable in Settings UI) ---
      EVL_HOST: ${EVL_HOST:-192.168.1.100}
      EVL_PORT: ${EVL_PORT:-4025}
      EVL_PASSWORD: ${EVL_PASSWORD:-}
      # --- App secrets ---
      # APP_SECRET encrypts the panel user code / EVL password at rest and signs sessions.
      # Generate with: openssl rand -hex 32
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required - see .env.example}
      # SQLite database path (inside the container / mounted volume).
      DB_PATH: /data/vista.db
      # Comma-separated allowed CORS origins (usually not needed behind the web proxy).
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - vista-data:/data
    # Not published to the host by default: the web container reaches it over the
    # internal Docker network as http://api:8000. Uncomment to debug directly.
    # ports:
    #   - "8000:8000"
    expose:
      - "8000"

  web:
    build: ./web
    container_name: vista-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  vista-data:
